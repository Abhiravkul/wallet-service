version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: wallet-postgres
    restart: always
    environment:
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_pass
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_user -d wallet_db"]
      interval: 10s
      retries: 5
    networks:
      - wallet-network

  redis:
    image: redis:7
    container_name: wallet-redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      REDIS_URL: redis://redis:6379
    networks:
      - wallet-network

  loki:
    image: grafana/loki:2.9.0
    container_name: wallet-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    networks:
      - wallet-network

  grafana:
    image: grafana/grafana:latest
    container_name: wallet-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - loki
    networks:
      - wallet-network

  backend:
    build: ./backend
    container_name: wallet-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      loki:
        condition: service_started
    environment:
      DATABASE_URL: postgres://wallet_user:wallet_pass@postgres:5432/wallet_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: wallet_user
      DB_PASSWORD: wallet_pass
      DB_NAME: wallet_db

      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379

      LOKI_HOST: http://loki:3100
      LOG_LEVEL: info
    networks:
      - wallet-network

  frontend:
    build: ./frontend
    container_name: wallet-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000
    networks:
      - wallet-network

volumes:
  postgres_data:

networks:
  wallet-network: