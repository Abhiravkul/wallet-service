version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: wallet-postgres
    environment:
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_pass
      POSTGRES_DB: wallet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: wallet-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: